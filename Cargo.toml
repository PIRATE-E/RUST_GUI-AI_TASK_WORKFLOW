[package]
name = "ai-workflow-gui"
version = "0.1.0"
edition = "2024"

build = "build.rs"

[dependencies]

# 1. default-features = false so 'FemtoVG' and 'Software' renderer fully off !
# 2. backend-winit: Cross-platform Window + Input (Linux/Windows/Mac/Android/Web)
# 3. renderer-skia-vulkan: Maximum GPU hardware acceleration via Google Skia + Vulkan!
slint = { version = "1.16.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia-vulkan",
] }
time-format = "1.2.4"

# When the auto-initialize feature is active: 
# PyO3 wraps Python::with_gil with an internal check: "Is CPython running?"
# If no, PyO3 automatically calls pyo3::prepare_freethreaded_python() for you before acquiring the lock.
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }


toml = "1.1.8"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
uuid = {version= "1.29.0", features=["v4"]}
[build-dependencies]
slint-build = "1.16.0"

# profile dev for workspace native source code to be compiled as un optimized and debug friendly !!
[profile.dev]
opt-level = 1

# profile dev for all external packages (package."*") means all packages as wild card except crate !! 
# for optimized slint code which rarely got to re compiled in future !!
[profile.dev.package."*"]
opt-level = 3
